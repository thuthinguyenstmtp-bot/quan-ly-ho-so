<!DOCTYPE html>
<html lang="vi">


<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="icon" type="image/png" href="./favicon.png?v=40">

    <title>Quản lý Hồ sơ</title>

    <link
    rel="stylesheet"
    href="./css/style.css?v=archive-premium-01"
>

<link
    rel="stylesheet"
    href="./css/theme.css?v=anime-reaction-glass-v6-1"
>

<link
    rel="stylesheet"
    href="./css/anime-reaction-motion.css?v=motion-01"
>

</head>

<body class="theme-sage">

<!-- =================================/theme.css
     NỀN ĐỘNG AMBIENT
     ================================= -->

<div
    class="ambient-background"
    aria-hidden="true"
>

    <span
        class="ambient-blob ambient-blob-one"
    ></span>

    <span
        class="ambient-blob ambient-blob-two"
    ></span>

    <span
        class="ambient-blob ambient-blob-three"
    ></span>


    <span
        class="ambient-leaf ambient-leaf-one"
    >
        🌿
    </span>

    <span
        class="ambient-leaf ambient-leaf-two"
    >
        🍃
    </span>

</div>

<div class="container">
<!-- =====================================
     SIDEBAR HIỆN ĐẠI
     ===================================== -->

<aside
    id="appSidebar"
    class="sidebar sidebar-modern"
>

    <!-- THƯƠNG HIỆU -->

    <div class="sidebar-modern-brand">

        <span class="sidebar-modern-kicker">
            HỆ THỐNG NỘI BỘ
        </span>

        <h1>
            Quản lý Hồ sơ
        </h1>

        <p>
            Quản lý dữ liệu tập trung
        </p>

    </div>


    <!-- ĐIỀU HƯỚNG -->

    <nav
        class="sidebar-modern-nav"
        aria-label="Điều hướng chính"
    >

        <button
            type="button"
            class="sidebar-modern-link"
            data-page="project"
        >
            <span>
                Dự án
            </span>
        </button>


        <button
            type="button"
            class="sidebar-modern-link"
            data-page="supplier"
        >
            <span>
                Nhà cung cấp
            </span>
        </button>


        <button
            type="button"
            class="sidebar-modern-link"
            data-page="letter"
        >
            <span>
                Quản lý thư
            </span>
        </button>


        <!-- NHÓM HỒ SƠ -->

        <div
            id="dossierSidebarGroup"
            class="sidebar-modern-group"
        >

            <button
                type="button"
                id="dossierSidebarToggle"
                class="sidebar-modern-group-toggle"
                aria-expanded="false"
                aria-controls="hosoMenu"
            >

                <span>
                    Hồ sơ
                </span>

                <span
                    class="sidebar-modern-chevron"
                    aria-hidden="true"
                ></span>

            </button>


            <div
                id="hosoMenu"
                class="sidebar-modern-submenu"
            >

                <button
                    type="button"
                    class="sidebar-modern-sublink"
                    data-page="dossier"
                >
                    Danh sách hồ sơ
                </button>


                <button
                    type="button"
                    class="sidebar-modern-sublink"
                    data-page="dossier_missing"
                >
                    Hồ sơ cần bổ sung
                </button>


                <button
                    type="button"
                    class="sidebar-modern-sublink"
                    data-page="dossier_delivery"
                >
                    Đã bàn giao
                </button>


                <button
                    type="button"
                    class="sidebar-modern-sublink"
                    data-page="dossier_paid"
                >
                    Đã thanh toán
                </button>


                <button
                    type="button"
                    class="sidebar-modern-sublink"
                    data-page="dossier_archive"
                >
                    Lưu hồ sơ
                </button>

            </div>

        </div>


        <button
            type="button"
            class="sidebar-modern-link"
            data-page="backup"
        >
            <span>
                Sao lưu dữ liệu
            </span>
        </button>

    </nav>


    <!-- ĐẨY CÁC KHỐI DƯỚI XUỐNG CUỐI -->

    <div class="sidebar-modern-spacer"></div>


    <!-- GIAO DIỆN -->

    <select
    id="themeSelector"
    data-sidebar-theme
>
    <option
        value="sage"
        selected
    >
        Sage Garden
    </option>

    <option value="ocean">
        Ocean
    </option>
    </select>

    </section>


    <!-- TÀI KHOẢN -->

    <section class="sidebar-modern-account">

        <div class="sidebar-modern-account-info">

            <span>
                Đang đăng nhập
            </span>

            <strong id="currentSystemUsername">
                Người dùng
            </strong>

        </div>


        <button
            type="button"
            id="sidebarLogoutButton"
            class="sidebar-modern-logout"
        >
            Đăng xuất
        </button>

    </section>

</aside>
    <!-- ========================= -->
    <!-- NỘI DUNG CHÍNH -->
    <!-- ========================= -->

    <main
        id="content"
        class="main-content"
    >

        <div class="system-loading">

            <div class="system-loading-spinner"></div>

            <span>
                Đang tải dữ liệu...
            </span>

        </div>

    </main>

</div>


<!-- ========================= -->
<!-- 1. PARSE SDK -->
<!-- ========================= -->

<script
    src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
></script>
<script src="https://unpkg.com/parse/dist/parse.min.js"></script>


<!-- ========================= -->
<!-- 2. BACK4APP CONFIG -->
<!-- ========================= -->

<script src="./js/back4app-config.js"></script>


<!-- ========================= -->
<!-- 3. ĐĂNG NHẬP -->
<!-- ========================= -->

<script src="./js/auth.js"></script>


<!-- ========================= -->
<!-- 4. CÁC MODULE -->
<!-- ========================= -->

<script
    src="./js/supplier.js?v=supplier-search-data-01"
></script>

<script
    src="./js/project.js?v=project-delete-fix-02"
></script>

<script
    src="./js/dossier.js?v=delivery-supplier-search-01"
></script>

<script src="./js/supplier-smart-match.js?v=smart-match-01"></script>

<script
    src="./js/dossier-missing-view.js?v=missing-view-01"
></script>

<script
    src="./js/dossier-export.js?v=export-fix-02"
></script>

<script
    src="./js/dossier-import.js?v=import-by-name-01"
></script>

<script
    src="./js/dossier_archive.js?v=archive-template-fix-10"
></script>

<script
    src="./js/letter.js?v=letter-modern-01"
></script>

<script src="./js/backup.js"></script>


<!-- ========================= -->
<!-- 5. APP -->
<!-- ========================= -->

<script src="./js/app.js?v=royal-navigation-fix-02"></script>

<script
    src="./js/effects.js?v=effects-02"
></script>

<script
    src="./js/ambient-effects.js?v=ambient-01"
></script>

<script
    src="./js/mascot.js?v=mascot-01"
></script>

<script
    src="./js/mascot-movement.js?v=mascot-move-01"
></script>

<script
    src="./js/anime-cutin.js?v=anime-reaction-03"
></script>

<script
    src="./js/anime-context.js?v=context-01"
></script>

<!-- ========================= -->
<!-- 6. KIỂM TRA ĐĂNG NHẬP -->
<!-- ========================= -->

<script>

    requireSystemLogin();

</script>

</body>

</html>
